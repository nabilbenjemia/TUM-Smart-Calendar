services:
  mysql:
    image: mysql:8.0
    container_name: smartcalendar-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - smartcalendar-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  authentication:
    build: ./backend/authentication
    container_name: smartcalendar-auth
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartcalendar_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_ROOT_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - smartcalendar-network
    develop:
      watch:
        - action: rebuild
          path: ./backend/authentication

  calendar:
    build: ./backend/calendar
    container_name: smartcalendar-calendar
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartcalendar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_ROOT_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      PYTHON_SERVICE_URL: http://genai:8082/api/llm/process-json
    depends_on:
      mysql:
        condition: service_healthy
      genai:
        condition: service_started
    networks:
      - smartcalendar-network
    develop:
      watch:
        - action: rebuild
          path: ./backend/calendar

  genai:
    build: ./backend/genai
    container_name: smartcalendar-genai
    ports:
      - "8082:8082"
    environment:
      GENAI_API_KEY: ${GENAI_API_KEY}
    networks:
      - smartcalendar-network
    develop:
      watch:
        - action: sync
          path: ./backend/genai
          target: /app
          ignore:
            - __pycache__
            - tests

  frontend:
    build: ./frontend
    container_name: smartcalendar-frontend
    ports:
      - "3000:80"
    depends_on:
      - authentication
      - calendar
    networks:
      - smartcalendar-network
    develop:
      watch:
        - action: rebuild
          path: ./frontend
          ignore:
            - node_modules

volumes:
  mysql-data:


networks:
  smartcalendar-network:
    driver: bridge
